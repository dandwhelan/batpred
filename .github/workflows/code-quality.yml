name: code-quality
on:
  pull_request:
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: 3.x
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - uses: pre-commit/action@v3.0.0
    - uses: pre-commit-ci/lite-action@v1.1.0
      if: always()
    - name: Build prediction kernel
      run: bash apps/predbat/build_kernel.sh
    - name: Run unit tests (quick mode)
      env:
        PREDBAT_KERNEL_REQUIRED: "1"
      run: |
        cd coverage
        pip install coverage
        python3 -m coverage run -p ../apps/predbat/unit_test.py --quick

    # The five tests --quick skips are the only cover the ML load forecaster has, and its
    # predictions feed straight into the plan: without this step load_ml_component.py sits
    # at 6% and load_predictor.py at 31% in CI, so a regression in either passes and is only
    # found by someone running the full suite locally. Together they take about three and a
    # half minutes and need no network - both integration tests drive a stub weather source.
    - name: Run unit tests (the slow ones quick mode skips)
      env:
        PREDBAT_KERNEL_REQUIRED: "1"
      run: |
        cd coverage
        python3 -m coverage run -p ../apps/predbat/unit_test.py \
          --test plan_preclip \
          --test load_ml \
          --test ml_training_perf \
          --test annual_integration \
          --test annual_heat_integration

    # Coverage floor, not a target - it only ever ratchets upwards. Both runs above are
    # combined first, so this measures the whole suite rather than quick mode alone, which
    # currently comes to 86.6%. The floor sits under that to leave room for ordinary churn;
    # raise it as coverage improves.
    - name: Check coverage has not regressed
      env:
        MIN_COVERAGE: "85"
      run: |
        cd coverage
        python3 -m coverage combine
        python3 -m coverage report \
          --omit='../apps/predbat/tests/*,../apps/predbat/unit_test.py' \
          --fail-under="$MIN_COVERAGE"
    - name: Verify checked-in x86_64 kernel binary
      run: |
        cd coverage
        python3 ../apps/predbat/verify_kernel_binary.py ../apps/predbat/prediction_kernel_lib_x86_64.so

    # The i686 and armv7l binaries take a different arithmetic path in round_py:
    # __int128 is a 64-bit-target extension, so those builds scale through uint64_t
    # instead. Nothing above executes that path - this runner is x86_64 and the
    # 32-bit binaries are never run - so build the same source with -DPK_NO_INT128,
    # which forces the narrow path on a 64-bit host, and put it through the full
    # parity suite.
    - name: Verify the 32-bit (narrow integer) rounding path
      env:
        EXTRA_CXXFLAGS: "-DPK_NO_INT128"
      run: |
        bash apps/predbat/build_kernel.sh "${RUNNER_TEMP}/prediction_kernel_narrow.so"
        cd coverage
        python3 ../apps/predbat/verify_kernel_binary.py "${RUNNER_TEMP}/prediction_kernel_narrow.so"

  # Cross-build the prediction kernel binaries for every platform and commit them
  # back to the PR branch when they change (same auto-fix pattern as pre-commit)
  kernel-binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.head_ref }}
    - uses: actions/setup-python@v4
      with:
        python-version: 3.x
    - uses: mlugg/setup-zig@v2
      with:
        version: 0.16.0
    - name: Cross-build prediction kernel binaries
      run: bash apps/predbat/build_kernel_cross.sh

    # Verify before committing, not after. The pre-commit job checked the binary as
    # it was when the PR was opened, i.e. the previous one; the binaries this job
    # regenerates are what actually ships, and the run triggered by pushing them
    # needs manual approval, so without this step they can merge unverified.
    # x86_64 is the only one this runner can execute natively - the others rely on
    # the source-level parity coverage in the pre-commit job.
    - name: Verify the freshly built x86_64 binary before committing
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        cd coverage
        python3 ../apps/predbat/verify_kernel_binary.py ../apps/predbat/prediction_kernel_lib_x86_64.so

    - name: Commit updated kernel binaries
      run: |
        git add apps/predbat/prediction_kernel_lib_*.so
        if git diff --cached --quiet; then
          echo "Kernel binaries unchanged"
        else
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update prediction kernel binaries for all platforms"
          git push
        fi
