name: build-docs
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          # Match the Predbat add-on image (3.14). "3.x" picked up Python 3.15, which numpy==2.3.5 has no
          # wheel for, so pip built it from source without an optimised BLAS and the ML tests ran ~6x slower.
          python-version: "3.14"
      - run: pip install mkdocs
      - run: mkdocs gh-deploy --force --clean --verbose
